server:
  port: 8080

spring:
  application:
    name: platform

  # Default to H2 for local testing
  datasource:
    url: jdbc:h2:mem:learningdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false

# JWT Configuration
app:
  jwtSecret: "======================LearningPlatformSecretKey======================"
  jwtExpirationMs: 86400000 # 24 hours

# PostgreSQL configuration for Cloud (active when profile explicitly set, e.g. prod)
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
