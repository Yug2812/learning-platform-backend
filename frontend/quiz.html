<!-- frontend/quiz.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - AI Learning Platform</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .option-label {
            display: block;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-label:hover { background: rgba(139, 92, 246, 0.1); border-color: var(--accent); }
        .option-input:checked + .option-label {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body class="app-layout">
    <header id="app-header" class="app-header"></header>
    <div class="main-content">
        <div id="quizAlert"></div>

        <!-- Topic Selection -->
        <div id="topicSelection" class="glass-panel animate-fade-in" style="max-width: 550px; margin: 0 auto;">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <span style="font-size: 3rem;">🧠</span>
                <h2 style="margin-top: 0.5rem;">Select Quiz Topic</h2>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Type a topic name to search and start your quiz</p>
            </div>
            <div class="form-group" style="position: relative;">
                <label class="form-label">Topic Name</label>
                <input type="text" id="topicNameInput" class="form-control" placeholder="e.g. Python, Data Structures, Networking..." autocomplete="off">
                <div id="topicSuggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px; z-index: 100; max-height: 200px; overflow-y: auto; box-shadow: 0 8px 20px rgba(0,0,0,0.4);">
                </div>
            </div>
            <button id="startQuizBtn" class="btn-primary" style="width: 100%; margin-top: 1rem;">🚀 Start Quiz</button>
        </div>

        <!-- Quiz Container -->
        <div id="quizContainer" style="display: none; max-width: 800px; margin: 0 auto;">
            <div class="glass-panel animate-fade-in">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 id="quizTitle">Topic Quiz</h2>
                    <span id="questionCounter" style="color: var(--accent); font-weight: 700;"></span>
                </div>
                
                <div id="questionsWrapper" class="mt-2"></div>
                
                <button id="submitQuizBtn" class="btn-primary mt-2" style="width: 100%;">Submit Answers</button>
            </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="glass-panel animate-fade-in" style="display: none; max-width: 500px; margin: 0 auto; text-align: center;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🏆</div>
            <h2>Quiz Completed!</h2>
            <div class="stat-value mt-2" id="scoreDisplay" style="font-size: 4rem;">0%</div>
            <p id="resultMessage" style="color: var(--text-secondary); margin-top: 1rem;"></p>
            <p id="suspiciousFlag" style="color: var(--danger); font-weight: 500; display: none; margin-top: 1rem;">⚠ Flagged for suspicious completion time.</p>
            
            <a href="dashboard.html" class="btn-primary mt-2">Return to Dashboard</a>
        </div>
    </div>
    <footer id="app-footer" class="app-footer"></footer>

    <script src="script.js"></script>
    <script>
        protectRoute();
        
        let questions = [];
        let startTime = null;
        let selectedTopicName = null;
        let searchTimeout = null;

        // Live topic search / autocomplete
        const topicNameInput = document.getElementById('topicNameInput');
        const suggestionsBox = document.getElementById('topicSuggestions');

        topicNameInput.addEventListener('input', () => {
            const query = topicNameInput.value.trim();
            clearTimeout(searchTimeout);
            if (query.length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }
            searchTimeout = setTimeout(async () => {
                try {
                    const results = await apiCall(`/student/topics/search?name=${encodeURIComponent(query)}`);
                    if (results && results.length > 0) {
                        suggestionsBox.innerHTML = results.map(t => `
                            <div class="dropdown-item" style="cursor: pointer;" data-name="${t.title}">${t.title}</div>
                        `).join('');
                        suggestionsBox.style.display = 'block';
                        suggestionsBox.querySelectorAll('.dropdown-item').forEach(el => {
                            el.addEventListener('click', () => {
                                topicNameInput.value = el.dataset.name;
                                suggestionsBox.style.display = 'none';
                            });
                        });
                    } else {
                        suggestionsBox.innerHTML = `<div class="dropdown-item" style="color: var(--text-secondary);">No matching topics found</div>`;
                        suggestionsBox.style.display = 'block';
                    }
                } catch(e) {
                    suggestionsBox.style.display = 'none';
                }
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#topicNameInput') && !e.target.closest('#topicSuggestions')) {
                suggestionsBox.style.display = 'none';
            }
        });

        document.getElementById('startQuizBtn').addEventListener('click', async () => {
            const name = topicNameInput.value.trim();
            if (!name) {
                showAlert('quizAlert', 'Please enter a topic name to start the quiz.', 'error');
                return;
            }
            selectedTopicName = name;

            const btn = document.getElementById('startQuizBtn');
            btn.textContent = '⏳ Loading...';
            btn.disabled = true;

            try {
                questions = await apiCall(`/student/topics/by-name/${encodeURIComponent(selectedTopicName)}/questions`);
                if (!questions || questions.length === 0) {
                    throw new Error('No questions found for this topic. Please check the topic name or ask your admin to add questions.');
                }

                document.getElementById('topicSelection').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'block';
                document.getElementById('quizTitle').textContent = `${selectedTopicName} Quiz`;
                startTime = new Date().toISOString();
                renderQuestions();
            } catch (err) {
                showAlert('quizAlert', err.message, 'error');
            } finally {
                btn.textContent = '🚀 Start Quiz';
                btn.disabled = false;
            }
        });


        function renderQuestions() {
            document.getElementById('questionCounter').textContent = `${questions.length} Questions`;
            const wrapper = document.getElementById('questionsWrapper');
            
            wrapper.innerHTML = questions.map((q, index) => `
                <div class="form-group" style="margin-bottom: 2rem;">
                    <h3 style="font-size: 1.1rem; margin-bottom: 1rem; color: white;">${index + 1}. ${q.text}</h3>
                    <div style="display: grid; gap: 0.5rem;">
                        <input type="radio" id="q${q.id}_A" name="q${q.id}" value="A" class="option-input" style="display:none;">
                        <label for="q${q.id}_A" class="option-label">A. ${q.optionA}</label>
                        
                        <input type="radio" id="q${q.id}_B" name="q${q.id}" value="B" class="option-input" style="display:none;">
                        <label for="q${q.id}_B" class="option-label">B. ${q.optionB}</label>
                        
                        <input type="radio" id="q${q.id}_C" name="q${q.id}" value="C" class="option-input" style="display:none;">
                        <label for="q${q.id}_C" class="option-label">C. ${q.optionC}</label>
                        
                        <input type="radio" id="q${q.id}_D" name="q${q.id}" value="D" class="option-input" style="display:none;">
                        <label for="q${q.id}_D" class="option-label">D. ${q.optionD}</label>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('submitQuizBtn').addEventListener('click', async () => {
            const answers = {};
            questions.forEach(q => {
                const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
                if (selected) answers[q.id] = selected.value;
            });

            const endTime = new Date().toISOString();
            const btn = document.getElementById('submitQuizBtn');
            btn.textContent = 'Evaluating...';
            btn.disabled = true;

            try {
                const result = await apiCall(`/student/quiz/submit`, {
                    method: 'POST',
                    body: JSON.stringify({
                        topicId: selectedTopicId,
                        answers: answers,
                        startTime: startTime,
                        endTime: endTime
                    })
                });

                document.getElementById('quizContainer').style.display = 'none';
                document.getElementById('resultContainer').style.display = 'block';

                document.getElementById('scoreDisplay').textContent = `${Math.round(result.percentage || 0)}%`;
                document.getElementById('resultMessage').textContent = result.message || `You scored ${result.score} out of ${result.totalQuestions}!`;
                
                if (result.flaggedSuspicious) {
                    document.getElementById('suspiciousFlag').style.display = 'block';
                }

            } catch (err) {
                showAlert('quizAlert', 'Failed to submit quiz. Ensure your inputs match database requirements.', 'error');
                btn.textContent = 'Submit Answers';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
