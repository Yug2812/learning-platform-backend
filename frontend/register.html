<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Learning Platform</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex-center">

    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 400px;">
        <h2 class="text-center">Create an Account</h2>
        <p class="text-center">Join our AI-powered learning platform.</p>
        
        <div id="registerAlert"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-control" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="student@example.com">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%">Sign Up</button>
        </form>
        
        <p class="text-center mt-2" style="font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: var(--accent);">Log in</a>
        </p>
    </div>

    <script src="script.js"></script>
    <script>
        if (isAuthenticated()) window.location.href = 'dashboard.html';

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Registering...';
            btn.disabled = true;

            try {
                await apiCall('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify({ name, email, password, roles: ["student"] })
                });
                
                showAlert('registerAlert', 'Registration successful! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = 'login.html', 1500);
            } catch (err) {
                showAlert('registerAlert', err.message, 'error');
            } finally {
                btn.textContent = 'Sign Up';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
